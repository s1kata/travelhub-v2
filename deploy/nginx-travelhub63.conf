# Production nginx: Travel Hub — двухслойный поиск (best practice)
#
# L1 Go search-cache-reader (быстрый cache read)
# L2 PHP monolith (fallback, если Go недоступен / timeout connect)
#
# Важно: Go → PHP должен ходить на /_internal/tourvisor-proxy.php (только localhost),
# иначе получится цикл: Nginx→Go→Nginx→Go…
#
# 1. Собрать: cd search-cache-reader && go build -o search-cache-reader .
# 2. systemd:
#      TOURVISOR_CACHE_DIR=/var/www/html/data/tourvisor_cache
#      PHP_TOURVISOR_PROXY_URL=http://127.0.0.1/_internal/tourvisor-proxy.php
#      LISTEN_ADDR=127.0.0.1:8080
# 3. Подключить этот файл в sites-enabled; nginx -t && reload.

fastcgi_cache_path /var/cache/nginx/tourvisor levels=1:2 keys_zone=tourvisor_cache:32m max_size=256m inactive=60m use_temp_path=off;

upstream search_cache_reader {
    server 127.0.0.1:8080 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name travelhub63.ru www.travelhub63.ru;
    return 301 https://travelhub63.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name travelhub63.ru;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /api/crm {
        rewrite ^/api/crm/?$ /backend/api/crm-mobile.php?path=&$args last;
        rewrite ^/api/crm/(.+)$ /backend/api/crm-mobile.php?path=$1&$args last;
    }

    # ------------------------------------------------------------------
    # L2 PHP (loop-safe): только с localhost — для Go sidecar при miss/live
    # ------------------------------------------------------------------
    location = /_internal/tourvisor-proxy.php {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/frontend/api/tourvisor-proxy.php;
        fastcgi_param HTTP_X_CACHE_READER_HINT php-go-upstream;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 130s;
        fastcgi_read_timeout 130s;
        # не кэшировать live search в nginx
        fastcgi_buffering off;
    }

    # ------------------------------------------------------------------
    # L1 Go primary → при 502/503/504 сразу L2 PHP (тот же публичный URL)
    # ------------------------------------------------------------------
    location = /frontend/api/tourvisor-proxy.php {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Быстро сдаёмся, если Go не слушает порт (не ждать десятки секунд)
        proxy_connect_timeout 1s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @tourvisor_php_fallback;

        proxy_pass http://search_cache_reader;
    }

    location @tourvisor_php_fallback {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/frontend/api/tourvisor-proxy.php;
        fastcgi_param HTTP_X_CACHE_READER_HINT php-nginx-fallback;
        # сохранить исходный query string публичного URL
        fastcgi_param QUERY_STRING $args;
        fastcgi_param REQUEST_URI /frontend/api/tourvisor-proxy.php$is_args$args;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 130s;
        fastcgi_read_timeout 130s;
        fastcgi_buffering off;
    }

    # Справочники — fastcgi_cache на PHP (доп. слой, если не через Go)
    location = /backend/api/dictionaries.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_cache tourvisor_cache;
        fastcgi_cache_valid 200 15m;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Fastcgi-Cache $upstream_cache_status always;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.travelhub63.ru;
    return 301 https://travelhub63.ru$request_uri;
}
