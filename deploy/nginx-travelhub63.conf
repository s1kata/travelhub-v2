# Production nginx: Travel Hub + search-cache-reader (Go sidecar)
#
# 1. Собрать бинарник: cd search-cache-reader && go build -o search-cache-reader .
# 2. systemd unit или screen: TOURVISOR_CACHE_DIR=/var/www/html/data/tourvisor_cache \
#      PHP_TOURVISOR_PROXY_URL=http://127.0.0.1/frontend/api/tourvisor-proxy.php \
#      ./search-cache-reader
# 3. Подключить этот файл в sites-enabled.

fastcgi_cache_path /var/cache/nginx/tourvisor levels=1:2 keys_zone=tourvisor_cache:32m max_size=256m inactive=60m use_temp_path=off;

upstream search_cache_reader {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name travelhub63.ru www.travelhub63.ru;
    return 301 https://travelhub63.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name travelhub63.ru;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /api/crm {
        rewrite ^/api/crm/?$ /backend/api/crm-mobile.php?path=&$args last;
        rewrite ^/api/crm/(.+)$ /backend/api/crm-mobile.php?path=$1&$args last;
    }

    # Go sidecar: быстрый read-path для Tourvisor (кэш hit ~30–80 ms).
    # Live search (live=1) проксируется в PHP из Go автоматически.
    location = /frontend/api/tourvisor-proxy.php {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_pass http://search_cache_reader;
    }

    # Справочники — дополнительный fastcgi_cache на PHP fallback (если Go недоступен).
    location = /backend/api/dictionaries.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_cache tourvisor_cache;
        fastcgi_cache_valid 200 15m;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Fastcgi-Cache $upstream_cache_status always;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.travelhub63.ru;
    return 301 https://travelhub63.ru$request_uri;
}
